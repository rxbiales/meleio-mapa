<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELEIO — Mapa de Documentos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0e0e0d;
    --bg2: #171715;
    --bg3: #1f1f1c;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e5dc;
    --text2: #8a887f;
    --text3: #555450;
    --accent: #c8b87a;
    --panel-w: 380px;
    --c-final: #1D9E75;
    --c-rev: #378ADD;
    --c-rasc: #BA7517;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #app { width: 100vw; height: 100vh; position: relative; }

  canvas { display: block; cursor: grab; width: 100%; height: 100%; }
  canvas.dragging { cursor: grabbing; }

  /* ── PANEL ─────────────────────────────── */
  #panel {
    position: fixed; top: 0; right: 0;
    width: var(--panel-w); height: 100vh;
    background: var(--bg2);
    border-left: 0.5px solid var(--border2);
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
    z-index: 20;
    display: flex; flex-direction: column;
  }
  #panel.open { transform: translateX(0); }

  #panel-header {
    padding: 20px 20px 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; background: var(--bg2);
    padding-bottom: 12px; border-bottom: 0.5px solid var(--border); z-index: 2;
  }

  #panel-breadcrumb {
    display: none; align-items: center; gap: 6px; margin-bottom: 8px;
  }
  #panel-back {
    background: none; border: 0.5px solid var(--border2); border-radius: 5px;
    color: var(--text3); cursor: pointer; padding: 2px 8px;
    font-size: 11px; font-family: 'DM Mono', monospace;
    transition: border-color .15s, color .15s;
  }
  #panel-back:hover { border-color: var(--text2); color: var(--text2); }
  #panel-crumb-label {
    font-family: 'DM Mono', monospace; font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text3);
  }

  #panel-eixo {
    font-family: 'DM Mono', monospace; font-size: 9px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px;
  }
  #panel-title { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 3px; }
  #panel-sub { font-size: 12px; color: var(--text2); }

  #panel-close {
    background: none; border: 0.5px solid var(--border2); border-radius: 6px;
    color: var(--text2); cursor: pointer; padding: 5px 8px; font-size: 14px;
    line-height: 1; flex-shrink: 0; margin-top: 2px;
    transition: border-color .15s, color .15s;
  }
  #panel-close:hover { border-color: var(--text2); color: var(--text); }

  #panel-body { padding: 16px 20px 24px; flex: 1; }

  .p-section { margin-bottom: 16px; }

  .p-progress-bar-wrap {
    height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 6px;
  }
  .p-progress-fill { height: 100%; background: var(--c-final); border-radius: 2px; transition: width .4s; }
  .p-progress-label {
    display: flex; justify-content: space-between;
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); margin-bottom: 8px;
  }
  .p-status-counts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .p-status-count {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text3);
  }
  .p-status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .p-desc {
    font-size: 13px; color: var(--text2); line-height: 1.7;
    margin-bottom: 16px; padding: 14px;
    background: var(--bg3); border-radius: 8px; border: 0.5px solid var(--border);
  }
  .p-desc p { margin-bottom: 8px; }
  .p-desc p:last-child { margin-bottom: 0; }

  .p-badge {
    display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px;
    border-radius: 20px; margin-bottom: 14px;
  }
  .badge-rascunho { background: rgba(186,117,23,.15); color: var(--c-rasc); border: 0.5px solid rgba(186,117,23,.3); }
  .badge-revisao  { background: rgba(55,138,221,.12); color: var(--c-rev);  border: 0.5px solid rgba(55,138,221,.25); }
  .badge-final    { background: rgba(29,158,117,.12); color: var(--c-final);border: 0.5px solid rgba(29,158,117,.25); }

  .p-link {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent);
    text-decoration: none; padding: 10px 14px;
    border: 0.5px solid rgba(200,184,122,.25); border-radius: 8px;
    transition: background .15s, border-color .15s; margin-bottom: 8px;
  }
  .p-link:hover { background: rgba(200,184,122,.06); border-color: rgba(200,184,122,.4); }
  .p-link.disabled { color: var(--text3); border-color: var(--border); cursor: default; pointer-events: none; }

  .p-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); margin-top: 14px; }

  .p-nav { display: flex; gap: 6px; margin-top: 16px; padding-top: 14px; border-top: 0.5px solid var(--border); }
  .p-nav-btn {
    flex: 1; background: var(--bg3); border: 0.5px solid var(--border2);
    border-radius: 8px; color: var(--text2); cursor: pointer; padding: 8px;
    font-size: 11px; font-family: 'DM Sans', sans-serif; text-align: center;
    transition: border-color .15s, color .15s;
  }
  .p-nav-btn:hover { border-color: var(--text2); color: var(--text); }
  .p-nav-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }

  .doc-list { display: flex; flex-direction: column; gap: 5px; }
  .doc-item {
    padding: 10px 12px; border: 0.5px solid var(--border); border-radius: 8px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .doc-item:hover { border-color: var(--border2); background: var(--bg3); }
  .doc-item-name { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .doc-item-sub  { font-size: 11px; color: var(--text3); }

  #panel-updated {
    padding: 0 20px 16px;
    font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px; color: var(--text3);
  }

  /* ── HEADER ─────────────────────────────── */
  #header { position: fixed; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
  #header-title {
    font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 4px; text-transform: uppercase; color: var(--text2); margin-bottom: 2px;
  }
  #header-sub { font-size: 11px; color: var(--text3); margin-bottom: 9px; }
  #header-stats {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3);
  }
  .stat-sep { opacity: .4; }
  .stat-final { color: var(--c-final); }
  .stat-rev   { color: var(--c-rev); }
  .stat-rasc  { color: var(--c-rasc); }

  /* ── CONTROLS ───────────────────────────── */
  #controls {
    position: fixed; bottom: 20px; left: 20px; z-index: 10;
    display: flex; gap: 8px; align-items: center;
  }
  .ctrl-btn {
    background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px;
    color: var(--text2); cursor: pointer; padding: 7px 14px;
    font-size: 12px; font-family: 'DM Sans', sans-serif;
    transition: border-color .15s, color .15s;
  }
  .ctrl-btn:hover { border-color: var(--text2); color: var(--text); }

  /* ? shortcuts */
  #shortcuts-wrap { position: relative; display: inline-block; }
  #shortcuts-btn {
    background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px;
    color: var(--text3); cursor: pointer; padding: 7px 10px;
    font-size: 11px; font-family: 'DM Mono', monospace;
    transition: border-color .15s, color .15s;
  }
  #shortcuts-btn:hover { border-color: var(--text2); color: var(--text2); }
  #shortcuts-tip {
    position: absolute; bottom: calc(100% + 8px); left: 0;
    background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 10px;
    padding: 12px 14px; min-width: 210px;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 40;
  }
  #shortcuts-wrap:hover #shortcuts-tip { opacity: 1; }
  .sc-row { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 6px; font-size: 11px; }
  .sc-row:last-child { margin-bottom: 0; }
  .sc-key {
    font-family: 'DM Mono', monospace; background: var(--bg3);
    border: 0.5px solid var(--border2); border-radius: 4px;
    padding: 1px 6px; font-size: 10px; color: var(--accent); flex-shrink: 0;
  }
  .sc-lbl { color: var(--text3); }

  /* ── LEGEND / FILTERS ───────────────────── */
  #legend-area {
    position: fixed; bottom: 20px; right: 20px;
    z-index: 10; display: flex; flex-direction: column; gap: 4px; align-items: flex-end;
  }
  #legend-area.shifted { right: calc(var(--panel-w) + 20px); }
  .leg-filter {
    display: flex; align-items: center; gap: 7px;
    font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text3); letter-spacing: 1px;
    cursor: pointer; padding: 4px 9px; border-radius: 20px;
    border: 0.5px solid transparent; transition: border-color .15s, background .15s, color .15s;
    user-select: none;
  }
  .leg-filter:hover { border-color: var(--border2); color: var(--text2); }
  .leg-filter.active { border-color: var(--border2); background: var(--bg3); color: var(--text); }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── TOOLTIP ────────────────────────────── */
  #tooltip {
    position: fixed; pointer-events: none; background: var(--bg2);
    border: 0.5px solid var(--border2); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--text);
    opacity: 0; transition: opacity .12s; z-index: 30; max-width: 250px;
  }
  #tooltip span { display: block; font-size: 10px; color: var(--text2); margin-top: 2px; }

  /* ── SEARCH OVERLAY ─────────────────────── */
  #search-overlay {
    position: fixed; inset: 0; background: rgba(14,14,13,.88);
    backdrop-filter: blur(4px); z-index: 60;
    display: flex; flex-direction: column; align-items: center; padding-top: 110px;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  #search-overlay.open { opacity: 1; pointer-events: all; }
  #search-box {
    width: 520px; max-width: 92vw;
    background: var(--bg2); border: 0.5px solid var(--border2);
    border-radius: 12px; overflow: hidden; box-shadow: 0 28px 70px rgba(0,0,0,.55);
  }
  #search-input-row {
    display: flex; align-items: center; padding: 14px 18px; gap: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  #search-icon { color: var(--text3); font-size: 15px; flex-shrink: 0; }
  #search-input {
    background: none; border: none; outline: none; color: var(--text);
    font-size: 14px; font-family: 'DM Sans', sans-serif; width: 100%;
  }
  #search-input::placeholder { color: var(--text3); }
  #search-results { max-height: 340px; overflow-y: auto; }
  .sr-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 18px;
    cursor: pointer; border-bottom: 0.5px solid var(--border); transition: background .1s;
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item.hi { background: var(--bg3); }
  .sr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sr-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-meta { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: 'DM Mono', monospace; }
  .sr-edot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .sr-empty { padding: 20px 18px; font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; letter-spacing: 1px; }
  #search-footer {
    padding: 8px 18px; border-top: 0.5px solid var(--border);
    display: flex; gap: 14px; align-items: center;
  }
  .sf-hint { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .sf-hint kbd {
    background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 3px;
    padding: 1px 5px; font-size: 9px; color: var(--text2); font-family: 'DM Mono', monospace;
  }

  /* ── ERROR ──────────────────────────────── */
  #err-msg {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    background: rgba(232,112,112,.12); border: 0.5px solid rgba(232,112,112,.3);
    color: #E87070; border-radius: 8px; padding: 10px 18px;
    font-size: 12px; font-family: 'DM Mono', monospace; letter-spacing: .5px;
    z-index: 15; opacity: 0; pointer-events: none; transition: opacity .3s; white-space: nowrap;
  }
  #err-msg.show { opacity: 1; }

  /* ── LOADER ─────────────────────────────── */
  #loader {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; z-index: 100; transition: opacity .4s;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader-text {
    font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--text3);
  }
  .loader-ring {
    width: 32px; height: 32px; border: 1.5px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <div id="loader-text">carregando mapa</div>
</div>

<div id="app">
  <canvas id="canvas"></canvas>

  <div id="header">
    <div id="header-title">MELEIO</div>
    <div id="header-sub">banco de documentos</div>
    <div id="header-stats"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" onclick="resetView()">↺ resetar</button>
    <button class="ctrl-btn" onclick="reloadData()">↻ atualizar</button>
    <div id="shortcuts-wrap">
      <button id="shortcuts-btn">?</button>
      <div id="shortcuts-tip">
        <div class="sc-row"><span class="sc-key">/</span><span class="sc-lbl">buscar documentos</span></div>
        <div class="sc-row"><span class="sc-key">esc</span><span class="sc-lbl">fechar painel / busca</span></div>
        <div class="sc-row"><span class="sc-key">← →</span><span class="sc-lbl">navegar entre docs</span></div>
        <div class="sc-row"><span class="sc-key">click</span><span class="sc-lbl">abrir / fechar nó</span></div>
      </div>
    </div>
  </div>

  <div id="legend-area">
    <div class="leg-filter" data-status="Finalizado" onclick="toggleFilter('Finalizado')">
      <div class="leg-dot" style="background:#1D9E75"></div>finalizado
    </div>
    <div class="leg-filter" data-status="Em revisão" onclick="toggleFilter('Em revisão')">
      <div class="leg-dot" style="background:#378ADD"></div>em revisão
    </div>
    <div class="leg-filter" data-status="Rascunho" onclick="toggleFilter('Rascunho')">
      <div class="leg-dot" style="background:#BA7517"></div>rascunho
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="err-msg"></div>

  <!-- SEARCH -->
  <div id="search-overlay" onclick="onOverlayClick(event)">
    <div id="search-box" onclick="event.stopPropagation()">
      <div id="search-input-row">
        <span id="search-icon">⌕</span>
        <input id="search-input" type="text" placeholder="buscar documentos..."
               autocomplete="off" oninput="onSearchInput()" onkeydown="onSearchKey(event)">
      </div>
      <div id="search-results"></div>
      <div id="search-footer">
        <span class="sf-hint"><kbd>↵</kbd> abrir</span>
        <span class="sf-hint"><kbd>↑↓</kbd> navegar</span>
        <span class="sf-hint"><kbd>esc</kbd> fechar</span>
      </div>
    </div>
  </div>

  <!-- PANEL -->
  <div id="panel">
    <div id="panel-header">
      <div style="flex:1; min-width:0">
        <div id="panel-breadcrumb">
          <button id="panel-back" onclick="backToEixo()">← voltar</button>
          <span id="panel-crumb-label"></span>
        </div>
        <div id="panel-eixo"></div>
        <div id="panel-title"></div>
        <div id="panel-sub"></div>
      </div>
      <button id="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div id="panel-body"></div>
    <div id="panel-updated"></div>
  </div>
</div>

<script>
const SHEET_ID  = '1A_lLuo1DU6BZ0yORc4AghrAgD5nAdEO2VZzJaS5b-kE';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

const EIXOS_CONFIG = [
  { id:'Pedagógico',            color:'#8B7FE8', ring:'rgba(139,127,232,0.18)' },
  { id:'Avaliação (PULSO)',     color:'#4DB896', ring:'rgba(77,184,150,0.18)'  },
  { id:'Formação de professor', color:'#E8845A', ring:'rgba(232,132,90,0.18)'  },
  { id:'IA',                    color:'#5BA8E8', ring:'rgba(91,168,232,0.18)'  },
  { id:'Família',               color:'#E87FA8', ring:'rgba(232,127,168,0.18)' },
  { id:'Comercial',             color:'#E8C05A', ring:'rgba(232,192,90,0.18)'  },
  { id:'Regulatório',           color:'#7EC87E', ring:'rgba(126,200,126,0.18)' },
  { id:'Produto e Tecnologia',  color:'#A0A09A', ring:'rgba(160,160,154,0.18)' },
  { id:'Evidência e Pesquisa',  color:'#E87070', ring:'rgba(232,112,112,0.18)' },
  { id:'Institucional',         color:'#9B8FD8', ring:'rgba(155,143,216,0.18)' },
];

const STATUS_COLOR = { 'Finalizado':'#1D9E75', 'Em revisão':'#378ADD', 'Rascunho':'#BA7517' };

function eixoCfg(label) {
  return EIXOS_CONFIG.find(e => label && label.toLowerCase().includes(e.id.toLowerCase()))
      || EIXOS_CONFIG.find(e => e.id === 'Produto e Tecnologia');
}

/* ── state ── */
let docs        = [];
let nodes       = [];
let transform   = { x:0, y:0, scale:1 };
let drag        = { active:false, sx:0, sy:0, tx:0, ty:0, moved:false };
let hoveredNode = null;
let activeNode  = null;
let panelOpen   = false;
let panelFromEixo = null;
let activeFilters = new Set();
let searchOpen  = false;
let searchFocus = -1;
let lastUpdated = null;
let dirty       = true;

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, CX = 0, CY = 0;

/* ── layout ── */
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  transform = { x: W/2, y: H/2, scale:1 };
  buildNodes(); dirty = true;
}

function buildNodes() {
  nodes = [];
  const grouped = {};
  docs.forEach(d => { (grouped[d.eixo] = grouped[d.eixo] || []).push(d); });

  const allEixos = [...new Set([...EIXOS_CONFIG.map(e => e.id), ...Object.keys(grouped)])];
  const n = allEixos.length;
  const eixoR    = Math.min(W,H) * 0.28;
  const docBaseR = Math.min(W,H) * 0.44;

  allEixos.forEach((eid, i) => {
    const angle = (2*Math.PI*i/n) - Math.PI/2;
    const cfg = eixoCfg(eid);
    const ex = CX + eixoR * Math.cos(angle);
    const ey = CY + eixoR * Math.sin(angle);

    nodes.push({ type:'eixo', id:eid, label:eid, color:cfg.color, ring:cfg.ring, x:ex, y:ey, angle, r:36 });

    const eDocs = grouped[eid] || [];
    eDocs.forEach((d, j) => {
      const tot   = eDocs.length;
      const spread = Math.min(Math.PI * 0.35, Math.PI * 0.1 * tot);
      const dAngle = angle + (tot > 1 ? spread * (j/(tot-1) - 0.5) : 0);
      const dr     = docBaseR + Math.floor(j/5) * 28;
      nodes.push({ type:'doc', eixoId:eid, color:cfg.color,
        x: CX + dr*Math.cos(dAngle), y: CY + dr*Math.sin(dAngle), r:9, data:d });
    });
  });
}

/* ── visibility ── */
function isDimmed(n) {
  if (n.type === 'eixo') return false;
  if (!activeFilters.size && !searchQuery()) return false;
  const filterOk = !activeFilters.size || activeFilters.has(n.data.status);
  const q = searchQuery();
  const searchOk = !q ||
    n.data.nome.toLowerCase().includes(q) ||
    n.data.subeixo.toLowerCase().includes(q) ||
    n.data.eixo.toLowerCase().includes(q);
  return !(filterOk && searchOk);
}
function searchQuery() {
  return searchOpen ? document.getElementById('search-input').value.trim().toLowerCase() : '';
}

/* ── draw ── */
function draw() {
  if (!dirty) return;
  dirty = false;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.scale, transform.scale);

  // dot grid
  ctx.fillStyle = 'rgba(255,255,255,0.025)';
  const gs = 40;
  const ox = (-transform.x / transform.scale) % gs;
  const oy = (-transform.y / transform.scale) % gs;
  for (let gx = ox-gs; gx < W/transform.scale+gs; gx += gs)
    for (let gy = oy-gs; gy < H/transform.scale+gs; gy += gs)
      ctx.fillRect(gx, gy, 1.5, 1.5);

  // eixo → doc connectors
  nodes.forEach(n => {
    if (n.type !== 'doc') return;
    const en = nodes.find(e => e.type==='eixo' && e.id===n.eixoId);
    if (!en) return;
    ctx.beginPath(); ctx.moveTo(en.x, en.y); ctx.lineTo(n.x, n.y);
    ctx.strokeStyle = isDimmed(n) ? n.color+'08' : n.color+'18';
    ctx.lineWidth = 0.8; ctx.stroke();
  });

  // center → eixo spokes
  nodes.forEach(n => {
    if (n.type !== 'eixo') return;
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(n.x, n.y);
    ctx.strokeStyle = n.color+'22'; ctx.lineWidth = 1; ctx.stroke();
  });

  // doc nodes
  nodes.forEach(n => {
    if (n.type !== 'doc') return;
    const hov = n === hoveredNode, act = n === activeNode;
    const dim = isDimmed(n);
    const sc  = STATUS_COLOR[n.data.status] || '#666';
    ctx.globalAlpha = dim ? 0.15 : 1;
    if (!dim && (hov||act)) {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r+10, 0, Math.PI*2);
      ctx.fillStyle = sc+'14'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r + (hov||act ? 2 : 0), 0, Math.PI*2);
    ctx.fillStyle = act ? n.color+'cc' : sc+'18'; ctx.fill();
    ctx.strokeStyle = act ? n.color : sc; ctx.lineWidth = act ? 2 : 1.5; ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // eixo nodes
  nodes.forEach(n => {
    if (n.type !== 'eixo') return;
    const hov = n === hoveredNode, act = n === activeNode;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r+10, 0, Math.PI*2);
    ctx.fillStyle = (hov||act) ? n.ring.replace('0.18','0.38') : n.ring; ctx.fill();
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fillStyle = act ? n.color : '#171715'; ctx.fill();
    ctx.strokeStyle = n.color; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = act ? '#fff' : n.color;
    ctx.font = `500 10px 'DM Sans', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const words = n.label.split(' '), lh = 12, lines = []; let cur = '';
    words.forEach(w => {
      const t = cur ? cur+' '+w : w;
      if (ctx.measureText(t).width > n.r*1.7 && cur) { lines.push(cur); cur = w; } else cur = t;
    });
    if (cur) lines.push(cur);
    const sy = n.y - (lines.length-1)*lh/2;
    lines.forEach((l,i) => ctx.fillText(l, n.x, sy+i*lh));
  });

  // center hub
  ctx.beginPath(); ctx.arc(CX, CY, 42, 0, Math.PI*2);
  ctx.fillStyle = '#171715'; ctx.fill();
  ctx.strokeStyle = 'rgba(200,184,122,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#c8b87a'; ctx.font = `500 13px 'DM Mono', monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('MELEIO', CX, CY-7);
  ctx.fillStyle = '#555450'; ctx.font = `400 8px 'DM Mono', monospace`;
  ctx.fillText('banco de docs', CX, CY+7);

  ctx.restore();
}

function loop() { draw(); requestAnimationFrame(loop); }

/* ── interaction ── */
function toWorld(ex, ey) {
  const r = canvas.getBoundingClientRect();
  return { x: (ex-r.left-transform.x)/transform.scale, y: (ey-r.top-transform.y)/transform.scale };
}
function hitNode(ex, ey) {
  const {x,y} = toWorld(ex,ey);
  for (let i = nodes.length-1; i >= 0; i--) {
    const n = nodes[i];
    if (Math.hypot(x-n.x, y-n.y) < n.r+8) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  drag = { active:true, moved:false, sx:e.clientX, sy:e.clientY, tx:transform.x, ty:transform.y };
  canvas.classList.add('dragging');
});
canvas.addEventListener('mousemove', e => {
  const n = hitNode(e.clientX, e.clientY);
  if (n !== hoveredNode) { hoveredNode = n; dirty = true; }
  canvas.style.cursor = n ? 'pointer' : (drag.active ? 'grabbing' : 'grab');
  showTip(n, e.clientX, e.clientY);
  if (drag.active) {
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
    transform.x = drag.tx+dx; transform.y = drag.ty+dy; dirty = true;
  }
});
canvas.addEventListener('mouseup', e => {
  drag.active = false; canvas.classList.remove('dragging');
  if (!drag.moved) {
    const n = hitNode(e.clientX, e.clientY);
    if (n) openPanel(n); else if (panelOpen) closePanel();
  }
});
canvas.addEventListener('mouseleave', () => {
  drag.active = false; canvas.classList.remove('dragging');
  hoveredNode = null; dirty = true;
  document.getElementById('tooltip').style.opacity = 0;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.91;
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  transform.x = mx+(transform.x-mx)*f; transform.y = my+(transform.y-my)*f;
  transform.scale = Math.max(0.25, Math.min(4, transform.scale*f)); dirty = true;
}, { passive:false });

let lastTouch = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    drag = { active:true, moved:false, sx:e.touches[0].clientX, sy:e.touches[0].clientY, tx:transform.x, ty:transform.y };
  }
  lastTouch = e.touches[0];
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length===1 && drag.active) {
    const dx = e.touches[0].clientX-drag.sx, dy = e.touches[0].clientY-drag.sy;
    if (Math.abs(dx)+Math.abs(dy) > 5) drag.moved = true;
    transform.x = drag.tx+dx; transform.y = drag.ty+dy; dirty = true;
  }
}, { passive:false });
canvas.addEventListener('touchend', () => {
  drag.active = false;
  if (!drag.moved && lastTouch) { const n = hitNode(lastTouch.clientX, lastTouch.clientY); if (n) openPanel(n); }
});

/* ── keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === '/' && !searchOpen && e.target.tagName !== 'INPUT') { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Escape') { if (searchOpen) closeSearch(); else if (panelOpen) closePanel(); return; }
  if (panelOpen && activeNode && activeNode.type === 'doc') {
    if (e.key === 'ArrowRight') navDoc(1);
    if (e.key === 'ArrowLeft')  navDoc(-1);
  }
});

function navDoc(dir) {
  const peers = nodes.filter(n => n.type==='doc' && n.eixoId===activeNode.eixoId);
  const next  = peers[peers.indexOf(activeNode)+dir];
  if (next) openDocAt(nodes.indexOf(next), true);
}

/* ── tooltip ── */
function showTip(node, ex, ey) {
  const tt = document.getElementById('tooltip');
  if (!node) { tt.style.opacity = 0; return; }
  if (node.type === 'eixo') {
    const d = nodes.filter(n => n.type==='doc' && n.eixoId===node.id);
    const f = d.filter(n => n.data.status==='Finalizado').length;
    tt.innerHTML = `<strong>${node.label}</strong><span>${d.length} doc${d.length!==1?'s':''} · ${f} finalizado${f!==1?'s':''}</span>`;
  } else {
    tt.innerHTML = `<strong>${node.data.nome}</strong><span>${node.data.subeixo}</span>`;
  }
  tt.style.opacity = 1;
  let lx = ex+14, ly = ey-10;
  if (lx+260 > window.innerWidth) lx = ex-260;
  tt.style.left = lx+'px'; tt.style.top = ly+'px';
}

/* ── panel ── */
function openPanel(node) {
  activeNode = node; panelFromEixo = null; panelOpen = true; dirty = true;
  document.getElementById('panel').classList.add('open');
  document.getElementById('legend-area').classList.add('shifted');
  document.getElementById('panel-breadcrumb').style.display = 'none';
  renderPanelNode(node);
  refreshUpdated();
}

function openDocAt(idx, keepEixo) {
  const n = nodes[idx]; if (!n) return;
  if (!keepEixo && activeNode && activeNode.type==='eixo') panelFromEixo = activeNode;
  activeNode = n; dirty = true;

  const bc     = document.getElementById('panel-breadcrumb');
  const bcLbl  = document.getElementById('panel-crumb-label');
  if (panelFromEixo) {
    bc.style.display = 'flex';
    bcLbl.textContent = panelFromEixo.label;
    bcLbl.style.color = eixoCfg(panelFromEixo.id).color;
  } else {
    bc.style.display = 'none';
  }
  renderPanelNode(n);
}

function backToEixo() {
  if (!panelFromEixo) return;
  const saved = panelFromEixo; panelFromEixo = null;
  openPanel(saved);
}

function renderPanelNode(node) {
  const eixoEl  = document.getElementById('panel-eixo');
  const titleEl = document.getElementById('panel-title');
  const subEl   = document.getElementById('panel-sub');
  const bodyEl  = document.getElementById('panel-body');

  if (node.type === 'eixo') {
    const cfg   = eixoCfg(node.id);
    const eDocs = nodes.filter(n => n.type==='doc' && n.eixoId===node.id);
    const tot   = eDocs.length;
    const fin   = eDocs.filter(n => n.data.status==='Finalizado').length;
    const rev   = eDocs.filter(n => n.data.status==='Em revisão').length;
    const rasc  = eDocs.filter(n => n.data.status==='Rascunho').length;
    const pct   = tot > 0 ? Math.round(fin/tot*100) : 0;

    eixoEl.textContent = 'eixo'; eixoEl.style.color = cfg.color;
    titleEl.textContent = node.label;
    subEl.textContent = tot + ' documento' + (tot!==1?'s':'');

    bodyEl.innerHTML = `
      <div class="p-section">
        <div class="p-progress-label">
          <span>progresso</span><span style="color:var(--c-final)">${fin} / ${tot} finalizados</span>
        </div>
        <div class="p-progress-bar-wrap"><div class="p-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="p-status-counts">
        ${fin  ? `<span class="p-status-count"><span class="p-status-dot" style="background:#1D9E75"></span>${fin} finalizado${fin!==1?'s':''}</span>` : ''}
        ${rev  ? `<span class="p-status-count"><span class="p-status-dot" style="background:#378ADD"></span>${rev} em revisão</span>` : ''}
        ${rasc ? `<span class="p-status-count"><span class="p-status-dot" style="background:#BA7517"></span>${rasc} rascunho${rasc!==1?'s':''}</span>` : ''}
        ${!tot ? `<span class="p-status-count">nenhum documento ainda</span>` : ''}
      </div>
      <div class="doc-list">
        ${eDocs.map(d => {
          const sc = STATUS_COLOR[d.data.status]||'#666';
          return `<div class="doc-item" onclick="openDocAt(${nodes.indexOf(d)})">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
              <div style="width:6px;height:6px;border-radius:50%;background:${sc};flex-shrink:0"></div>
              <div class="doc-item-name">${esc(d.data.nome)}</div>
            </div>
            <div class="doc-item-sub">${esc(d.data.subeixo)}</div>
          </div>`;
        }).join('')}
      </div>`;

  } else {
    const d   = node.data;
    const cfg = eixoCfg(node.eixoId);
    eixoEl.textContent = d.eixo; eixoEl.style.color = cfg.color;
    titleEl.textContent = d.nome; subEl.textContent = d.subeixo;

    const bClass   = d.status==='Finalizado' ? 'badge-final' : d.status==='Em revisão' ? 'badge-revisao' : 'badge-rascunho';
    const hasLink  = d.link && d.link.startsWith('http') && d.link.length > 8;
    const descHtml = d.desc
      ? d.desc.split(/\n\n+/).map(p => `<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')
      : '<p>Sem descrição.</p>';

    const peers    = nodes.filter(n => n.type==='doc' && n.eixoId===node.eixoId);
    const pi       = peers.indexOf(node);
    const prevIdx  = nodes.indexOf(peers[pi-1]);
    const nextIdx  = nodes.indexOf(peers[pi+1]);

    bodyEl.innerHTML = `
      <span class="p-badge ${bClass}">${d.status}</span>
      <div class="p-desc">${descHtml}</div>
      ${hasLink
        ? `<a class="p-link" href="${d.link}" target="_blank" rel="noopener">↗ abrir no drive</a>`
        : `<div class="p-link disabled">↗ link pendente</div>`}
      <div class="p-date">${esc(d.data)}</div>
      <div class="p-nav">
        <button class="p-nav-btn" onclick="openDocAt(${prevIdx},true)" ${pi===0?'disabled':''}>← anterior</button>
        <button class="p-nav-btn" onclick="openDocAt(${nextIdx},true)" ${pi===peers.length-1?'disabled':''}>próximo →</button>
      </div>`;
  }
}

function closePanel() {
  panelOpen = false; activeNode = null; panelFromEixo = null; dirty = true;
  document.getElementById('panel').classList.remove('open');
  document.getElementById('legend-area').classList.remove('shifted');
}

function resetView() { transform = { x:W/2, y:H/2, scale:1 }; dirty = true; }

/* ── filters ── */
function toggleFilter(status) {
  activeFilters.has(status) ? activeFilters.delete(status) : activeFilters.add(status);
  document.querySelectorAll('.leg-filter').forEach(el =>
    el.classList.toggle('active', activeFilters.has(el.dataset.status)));
  dirty = true;
}

/* ── search ── */
function openSearch() {
  searchOpen = true; searchFocus = -1;
  document.getElementById('search-overlay').classList.add('open');
  const inp = document.getElementById('search-input');
  inp.value = '';
  renderResults('');
  setTimeout(() => inp.focus(), 40);
}
function closeSearch() {
  searchOpen = false;
  document.getElementById('search-overlay').classList.remove('open');
  dirty = true;
}
function onOverlayClick(e) { if (e.target === document.getElementById('search-overlay')) closeSearch(); }

function onSearchInput() {
  searchFocus = -1;
  renderResults(document.getElementById('search-input').value.trim());
  dirty = true;
}

function renderResults(q) {
  const cont = document.getElementById('search-results');
  if (!q) { cont.innerHTML = ''; return; }
  const lo = q.toLowerCase();
  const hits = nodes.filter(n =>
    n.type==='doc' && (
      n.data.nome.toLowerCase().includes(lo) ||
      n.data.subeixo.toLowerCase().includes(lo) ||
      n.data.eixo.toLowerCase().includes(lo)
    )
  ).slice(0, 8);

  if (!hits.length) { cont.innerHTML = `<div class="sr-empty">nenhum resultado para "${esc(q)}"</div>`; return; }

  cont.innerHTML = hits.map((n,i) => {
    const sc  = STATUS_COLOR[n.data.status]||'#666';
    const cfg = eixoCfg(n.eixoId);
    return `<div class="sr-item${i===searchFocus?' hi':''}" onclick="pickResult(${nodes.indexOf(n)})">
      <div class="sr-dot" style="background:${sc}"></div>
      <div style="min-width:0">
        <div class="sr-name">${hilite(esc(n.data.nome), q)}</div>
        <div class="sr-meta"><span class="sr-edot" style="background:${cfg.color}"></span>${esc(n.data.eixo)} · ${esc(n.data.subeixo)}</div>
      </div>
    </div>`;
  }).join('');
}

function hilite(text, q) {
  const lo = q.toLowerCase(), idx = text.toLowerCase().indexOf(lo);
  if (idx === -1) return text;
  return text.slice(0,idx) + `<mark style="background:rgba(200,184,122,.2);color:var(--accent);border-radius:2px">${text.slice(idx,idx+q.length)}</mark>` + text.slice(idx+q.length);
}

function pickResult(nodeIdx) {
  closeSearch(); openPanel(nodes[nodeIdx]);
}

function onSearchKey(e) {
  const items = document.getElementById('search-results').querySelectorAll('.sr-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault(); searchFocus = Math.min(searchFocus+1, items.length-1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault(); searchFocus = Math.max(searchFocus-1, -1);
  } else if (e.key === 'Enter' && searchFocus >= 0 && items[searchFocus]) {
    items[searchFocus].click(); return;
  } else if (e.key === 'Escape') { closeSearch(); return; }
  items.forEach((r,i) => r.classList.toggle('hi', i===searchFocus));
  if (searchFocus >= 0 && items[searchFocus]) items[searchFocus].scrollIntoView({ block:'nearest' });
}

/* ── stats ── */
function updateStats() {
  const tot  = docs.length;
  const fin  = docs.filter(d => d.status==='Finalizado').length;
  const rev  = docs.filter(d => d.status==='Em revisão').length;
  const rasc = docs.filter(d => d.status==='Rascunho').length;
  document.getElementById('header-stats').innerHTML = tot ? `
    <span>${tot} docs</span><span class="stat-sep">·</span>
    <span class="stat-final">${fin} finalizados</span><span class="stat-sep">·</span>
    <span class="stat-rev">${rev} em revisão</span><span class="stat-sep">·</span>
    <span class="stat-rasc">${rasc} rascunhos</span>` : '';
}

function refreshUpdated() {
  if (!lastUpdated) return;
  const t  = new Date(lastUpdated);
  const hh = String(t.getHours()).padStart(2,'0');
  const mm = String(t.getMinutes()).padStart(2,'0');
  document.getElementById('panel-updated').textContent = `atualizado às ${hh}:${mm}`;
}

/* ── utils ── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4500);
}

/* ── data ── */
function parseCSV(text) {
  return text.trim().split('\n').slice(1).map(line => {
    const cols = []; let cur='', inQ=false;
    for (let i=0; i<line.length; i++) {
      const c = line[i];
      if (c==='"') { inQ=!inQ; continue; }
      if (c===',' && !inQ) { cols.push(cur.trim()); cur=''; continue; }
      cur += c;
    }
    cols.push(cur.trim());
    return { eixo:cols[0]||'', subeixo:cols[1]||'', nome:cols[2]||'', link:cols[3]||'', desc:cols[4]||'', status:cols[5]||'Rascunho', data:cols[6]||'' };
  }).filter(d => d.nome && d.eixo);
}

function reloadData() {
  document.getElementById('loader-text').textContent = 'atualizando...';
  document.getElementById('loader').classList.remove('hidden');
  fetchData();
}

function fetchData() {
  fetch(SHEET_URL + '&cachebust=' + Date.now())
    .then(r => r.text())
    .then(csv => {
      const loaded = parseCSV(csv);
      if (loaded.length > 0) docs = loaded;
      buildNodes(); dirty = true;
      lastUpdated = Date.now();
      updateStats(); refreshUpdated();
      document.getElementById('loader').classList.add('hidden');
    })
    .catch(() => {
      document.getElementById('loader').classList.add('hidden');
      showErr('erro ao carregar — verifique a conexão');
    });
}

window.addEventListener('resize', resize);
resize();
loop();
fetchData();
</script>
</body>
